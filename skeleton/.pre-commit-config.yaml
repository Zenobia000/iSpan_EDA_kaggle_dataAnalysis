# 工具無關的防線：Codex 與手動 commit 也會執行。安裝：pre-commit install
repos:
  - repo: local
    hooks:
      - id: no-raw-data
        name: 原始資料與 holdout 不可提交
        entry: "data/ 底下只能提交 README.md 與 .gitkeep"
        language: fail
        files: ^data/.+/(?!\.gitkeep$)[^/]+$
      - id: skills-in-sync
        name: .claude/skills 與 .agents/skills 一致
        entry: diff -r .claude/skills .agents/skills
        language: system
        pass_filenames: false
        files: ^(\.claude|\.agents)/skills/
      - id: leakage-tests
        name: 洩漏擾動測試
        entry: sh -c 'ls tests/test_leakage*.py >/dev/null 2>&1 || exit 0; python -m pytest tests/test_leakage*.py -q'
        language: system
        pass_filenames: false
        files: ^src/
