<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>混雜因素與分層比較</title>
<link rel="stylesheet" href="../assets/base.css"><script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script><script src="../assets/draw.js"></script>
<style>.n{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:30px;line-height:1.3}.s{position:absolute;font-size:22px;text-align:center}</style></head><body><div class="slide">
  <h1>相關不等於因果：混雜因素</h1><p class="lead">付款方式和退訂看起來有關，其實兩者都被「訂閱意圖」影響。</p>
  <div class="n" style="left:320px;top:300px;width:360px;height:110px">訂閱意圖<span style="font-size:24px" class="mut">混雜因素</span></div>
  <div class="n" style="left:130px;top:640px;width:270px;height:90px">付款方式</div>
  <div class="n" style="left:600px;top:640px;width:270px;height:90px">是否退訂</div>
  <div class="abs lbl mut" style="left:410px;top:745px;width:180px;text-align:center">看起來有關</div>
  <div class="abs note" style="left:130px;top:820px;width:760px">生活版：天氣熱，冰淇淋賣得多、游泳的人也多——<br>冰淇淋銷量和溺水人數就「相關」了</div>
  <div class="abs" style="left:1020px;top:290px;font-size:30px">分組比較</div>
  <div class="s" style="left:1040px;top:455px;width:90px">4%</div><div class="s" style="left:1180px;top:300px;width:90px">15%</div>
  <div class="s" style="left:1025px;top:565px;width:120px">信用卡</div><div class="s" style="left:1165px;top:565px;width:120px">超商代碼</div>
  <div class="abs ver" style="left:1340px;top:420px;width:470px;font-size:26px;line-height:1.5">推廣信用卡綁定後，退訂率卻沒有下降</div>
  <div class="abs" style="left:1020px;top:615px;font-size:30px">分層比較 <span class="note">示意</span></div>
  <div class="abs note" style="left:1020px;top:660px;width:800px">依「第一個月看完 5 部以上影片」分兩層，各自再比一次</div>
  <div class="s" style="left:1060px;top:870px;width:300px">看完 5 部以上</div><div class="s" style="left:1470px;top:870px;width:300px">未達 5 部</div>
  <div class="read"><em>怎麼讀：</em>分層就是把最上面的「訂閱意圖」固定住，看虛線還在不在；每一層內差距都消失，代表原本的關聯來自混雜。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
D.rect(320,300,360,110,'#f7d6cf',{fillStyle:'solid',stroke:D.C.ver,strokeWidth:3});
D.rect(130,640,270,90,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});
D.rect(600,640,270,90,'#d9e1ee',{fillStyle:'solid',stroke:D.C.ind,strokeWidth:3});
D.arrow(420,415,280,630,{strokeWidth:3});D.arrow(580,415,720,630,{strokeWidth:3});
D.dash(405,685,595,685,{strokeWidth:2.5});
D.line(960,290,960,900,{stroke:D.C.grey,strokeWidth:1.5});
/* 分組：高度依 4% 與 15% */
const B=560,k=15;D.rect(1040,B-4*k,90,4*k,'ind',{fillStyle:'solid'});D.rect(1180,B-15*k,90,15*k,'ver',{fillStyle:'solid'});D.line(1020,B,1310,B);
/* 分層示意 */
const B2=860;
D.rect(1120,B2-60,70,60,'ind',{fillStyle:'solid'});D.rect(1220,B2-66,70,66,'ver',{fillStyle:'solid'});D.line(1060,B2,1360,B2);
D.rect(1530,B2-138,70,138,'ind',{fillStyle:'solid'});D.rect(1630,B2-146,70,146,'ver',{fillStyle:'solid'});D.line(1470,B2,1770,B2);
D.line(1415,700,1415,880,{stroke:D.C.ink,strokeWidth:2});
</script></body></html>
