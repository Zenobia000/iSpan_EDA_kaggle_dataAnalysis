  <div class="abs ch" style="left:110px;top:100px">第 1 章</div>
  <h1 class="abs xl" style="left:110px;top:150px">問題分析與拆解</h1>
  <p class="abs lead" style="left:110px;top:300px;width:780px;margin:0">預測任務由<b>決策</b>決定，不是由資料決定。先問「誰、在什麼時候、要做什麼決定」，再看資料。</p>
  <div id="goals"><h2>學習目標</h2><ul class="dots" style="margin-top:20px">
    <li>把模糊的商業需求，轉成完整的預測任務規格</li>
    <li>說明預測時點 T0，並依決策時點推導它</li>
    <li>選出符合決策的主指標與基準模型，說得出理由</li>
    <li>事先訂好停止條件</li>
    <li>用 MECE 把問題拆成可以驗證的小問題</li></ul></div>
  <div class="case"><span class="mus">本章案例</span>　連鎖超市 200 間門市的缺貨預警：「能不能用資料提早知道哪些商品快缺貨？」</div>
