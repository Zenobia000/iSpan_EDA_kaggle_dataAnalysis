<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>時點正確的歷史特徵</title>
<link rel="stylesheet" href="../assets/base.css"><script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script><script src="../assets/draw.js"></script>
<style>.ph{position:absolute;left:110px;width:330px;font-size:30px;line-height:1.4}
.ph .note{display:block;margin-top:6px}
.cv{position:absolute;width:120px;text-align:center;font-size:30px}
.od{position:absolute;width:340px;text-align:center;font-size:24px}</style></head><body><div class="slide">
<h1>歷史特徵：只用當時已經知道的</h1><p class="lead">小陳的 4 筆訂單，特徵「這位顧客的退貨率」——兩種算法。</p>
<div class="ph ver" style="top:330px">偷看未來<span class="note">用整份資料算，<br>每筆都填 2/4</span></div>
<div class="ph ind" style="top:640px">時點正確<span class="note">只用 T0 前已知、<br>排除自己</span></div>
<div id="t"></div>
<div class="abs note ver" style="left:978px;top:282px;width:250px">③ 的結果 6 月才出現，<br>卻被 3 月的 ② 拿來用</div>
<div class="abs note" style="left:420px;top:575px;width:220px;text-align:center">新顧客給<br>整體平均，不給 0</div>
<div class="read"><em>怎麼讀：</em>上排每個圓都是 50%，② 用到了未來（朱紅虛線）；下排數字隨時間長出來——看「結果何時被知道」，不是「事件何時發生」。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');
const X=[530,910,1290,1670],M=['1 月','3 月','6 月','9 月'],N=['① 電視','② 冰箱','③ 洗衣機','④ 冷氣'],R=['否','是','是','否'];
const topV=['50%','50%','50%','50%'],bot=['平均','0%','50%','67%'];let h='';
[[470,375,topV,'#f7d6cf',D.C.ver],[790,700,bot,'#d9e1ee',D.C.ind]].forEach(([ly,cy,vals,fill,st],p)=>{
 D.line(470,ly,1780,ly,{stroke:D.C.grey,strokeWidth:2});
 X.forEach((x,i)=>{D.sq(x-32,ly-32,64,R[i]==='是'?'ver':'ind',{fillStyle:'solid',strokeWidth:2});
  const g=p===1&&i===0;D.ci(x,cy,100,g?'#e8e3d8':fill,{fillStyle:'solid',stroke:g?D.C.grey:st,strokeWidth:3});
  h+=`<div class="cv" style="left:${x-60}px;top:${cy-21}px;${g?'font-size:26px;color:#5b574f':''}">${vals[i]}</div>`;
  h+=`<div class="od" style="left:${x-170}px;top:${ly+40}px">${M[i]}　${N[i]}　退：<span class="${R[i]==='是'?'ver':''}">${R[i]}</span></div>`;});});
// top: order ② uses all four, incl. future ③④
[0,2,3].forEach(i=>D.line(X[i],438,X[1]+(i>1?40:-40),405,{stroke:i>1?D.C.ver:D.C.grey,strokeWidth:i>1?3:2,strokeLineDash:i>1?[8,8]:undefined}));
// bottom: order ④ uses only ①②③
D.line(X[0],748,X[3]-75,748,{stroke:D.C.ind,strokeWidth:2.6});[0,1,2].forEach(i=>D.line(X[i],748,X[i],758,{stroke:D.C.ind,strokeWidth:2.6}));D.arrow(X[3]-75,748,X[3]-48,728,{stroke:D.C.ind,strokeWidth:2.6});
document.getElementById('t').innerHTML=h;</script></body></html>
