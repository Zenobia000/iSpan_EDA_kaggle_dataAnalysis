<div id="l"><div class="ch">第 6 章</div><h1 class="xl" style="margin-top:6px">人機協作的<br>資料科學</h1>
<p class="lead">AI 讓實驗變便宜，所以<b>判斷哪個結果可信</b>，<br>成為人類最有價值的能力。</p></div>
<div id="g"><h2>學習目標</h2><ul class="dots">

<li>劃分人與 AI 的責任，指出必須由人決定的時點</li>
<li>用驗收思維審查 AI 產出的分析結論</li></ul></div>
<div id="case"><span class="k">本章案例</span>分析師小林請 AI 預測下個月會流失的會員。AI 一個下午跑了 <b>40 個實驗</b>，回報 PR-AUC 從 0.21 提升到 0.38——能相信嗎？</div>
