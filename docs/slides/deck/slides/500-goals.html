<div id="left"><div class="ch">第 5 章</div><h1 class="xl">模型選擇<br>與評估</h1>
<p class="lead">模型是畫龍點睛：<b>先有基準，再談升級。</b><br>在表格資料上，換模型帶來的進步，<br>通常小於一個好特徵。</p></div>
<div id="right"><h2>學習目標</h2><ul class="dots">
<li>說明為什麼一定要從基準開始，並建立兩種基準</li>
<li>用直覺說明線性、決策樹、隨機森林、梯度提升樹、表格基礎模型怎麼運作</li>
<li>依資料規模、特徵型態、解釋需求與部署限制選模型</li>
<li>設計公平比較，用過擬合差距與校準檢查可用性</li></ul></div>
<div id="case"><div class="t">本章案例：銀行信用卡審核</div>
審核當下（T0）預測申請人 12 個月內會不會違約。<br>約 <span class="ind">8,000 筆</span>歷史申請、<span class="ind">30 個欄位</span>；<br>主管機關要求<b>每一筆拒絕都要能說明理由</b>。</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
