<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>第 5 章小結</title>

<style>
#pts{position:absolute;left:110px;top:270px;width:900px}

<h1>第 5 章小結</h1>
<ul class="dots" id="pts">
<li>先建立兩種基準：不學習的基準（值不值得做模型）與簡單模型基準（值不值得做複雜的事）</li>
<li>線性＝加權總和、決策樹＝是非題、隨機森林＝投票、梯度提升樹＝接力修正、表格基礎模型＝預訓練通才</li>
<li>表格資料預設選梯度提升樹；但最符合決策需求的模型才是最好的</li>
<li>公平比較：相同切分、相同特徵、對等調參，同 fold 配對比較</li>
<li>看過擬合差距；要用機率數值時，檢查校準</li></ul>
<div class="k" style="left:1110px;top:470px">加權總和</div><div class="k" style="left:1380px;top:470px">是非題</div><div class="k" style="left:1640px;top:470px">投票</div>
<div class="k" style="left:1240px;top:760px">接力修正</div><div class="k" style="left:1510px;top:760px">預訓練通才</div>
<div class="next">下一章：人機協作的資料科學</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>
<script>const D=Draw('r');

// 是非題
D.dia(1480,350,60,'#f7e7c0',{fillStyle:'solid'});D.line(1455,365,1430,420);D.line(1505,365,1530,420);D.sq(1412,420,36,'grey',{fillStyle:'solid',strokeWidth:1});D.sq(1512,420,36,'ver',{fillStyle:'solid',strokeWidth:1});
// 投票
for(let r=0;r<2;r++)for(let c=0;c<3;c++)D.sq(1680+c*32,340+r*32,22,'ind',{fillStyle:'solid',strokeWidth:1});D.ci(1740,430,50,'mus',{strokeWidth:1.6});
