<h1>三個必須由人拍板的閘門</h1><p class="lead">AI 做到這裡必須停下來，由人決定才能繼續。</p>
<div class="g ind" style="left:230px;top:425px">閘門 1<small>開始前</small></div>
<div class="g" style="left:700px;top:445px">AI 執行<br>一輪實驗</div>
<div class="g ind" style="left:1140px;top:425px">閘門 2<small>每輪結束</small></div>
<div class="g ind" style="left:1560px;top:425px">閘門 3<small>交付時</small></div>
<div class="abs lbl ver" style="left:840px;top:278px;width:300px;text-align:center">繼續？由人決定，不是 AI</div>
<div class="abs lbl" style="left:1395px;top:420px">停止</div>
<div class="d" style="left:110px;width:440px"><span>定義問題</span>支援什麼決策、預測時點、可用資訊、驗證方式、停止條件<em class="y" style="font-style:normal">定錯了，後面全部白做</em></div>
<div class="d" style="left:640px;width:330px"><span class="mut">可重複很多輪</span>寫程式、跑實驗、畫圖都交給 AI</div>
<div class="d" style="left:1050px;width:380px"><span>審查</span>哪些結論值得留下、下一步做什麼、要不要停<em class="y" style="font-style:normal">涉及成本、風險與優先順序的取捨</em></div>
<div class="d" style="left:1480px;width:340px"><span>上線與否</span>要不要上線、怎麼向決策者說明限制<em class="y" style="font-style:normal">需要有人承擔後果</em></div>
<div class="read"><em>怎麼讀：</em>三個圓是人做決定的地方，方塊是 AI 的工作；注意閘門 2 往回的箭頭——是否再跑一輪，是人拍板。</div>
