<div id="left"><div class="ch">第 3 章</div><h1 class="xl">資料切分<br>與洩漏</h1>
<p class="lead">驗證要<b>模擬上線那一刻</b>。<br>一句話擋下大多數洩漏：<br>「預測那一刻，這個值存在嗎？」</p></div>
<div id="right"><h2>學習目標</h2><ul class="dots">
<li>用「考試」比喻說明訓練、驗證、保留集，以及保留集為什麼只能用一次</li>
<li>依上線情境選切分方式：新對象用群組、未來事件用時間</li>
<li>說明滾動起點回測與季節性樸素預測</li>
<li>用同 fold 配對比較判斷進步是否穩定</li>
<li>辨識五種洩漏，說明擾動測試與對抗驗證</li></ul></div>
<div id="case"><div class="t">本章案例</div>
<span class="ind">A 醫院再入院：</span>病人出院時，預測 30 天內會不會再住院（同一人可能住院很多次）<br>
<span class="ind">B 門市銷量：</span>每週日晚上，預測下週一到週日每天的銷量</div>
</div><svg class="rough" id="r" width="1920" height="1080"></svg>

</script></body></html>
