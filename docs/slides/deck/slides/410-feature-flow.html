<div class="pn" style="left:300px"><span>消融實驗</span>一次只加或拿掉一組，切分、模型、參數全部固定</div>
<div class="pn" style="left:900px"><span>邊際價值</span>已有「過去退貨率」，再加「過去退款金額」——重疊太多，沒有幫助</div>
<div class="pn" style="left:1480px"><span>置換重要度</span>在<b>驗證集</b>上打亂一欄，看分數掉多少</div>
