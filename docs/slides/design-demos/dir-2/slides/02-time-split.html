<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>時間切分</title>
<link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
<style>
#t{position:absolute;left:110px;top:90px}
#t p{font-size:30px;margin-top:14px}
.row{position:absolute;left:110px;font-size:30px}
.m{position:absolute;font-size:20px;color:#5b574f;width:62px;text-align:center}
#key{position:absolute;left:1560px;top:300px;width:300px}
.k{position:absolute;left:1690px;font-size:34px}
#read{position:absolute;left:110px;top:900px;width:1380px;font-size:28px;line-height:1.55}
</style></head><body><div class="slide">
<div id="t"><h1>時間切分：用過去預測未來</h1>
<p class="muted">擴張視窗——每一次驗證，訓練都從起點開始，而且比上一次多一個月。</p></div>
<div class="row" style="top:398px">Fold 1</div><div class="row" style="top:508px">Fold 2</div>
<div class="row" style="top:618px">Fold 3</div><div class="row" style="top:728px">保留集</div>
<div id="months"></div>
<div class="k" style="top:342px">訓練</div><div class="k" style="top:532px">驗證</div><div class="k" style="top:722px">保留集<br><span class="muted" style="font-size:24px">只看一次</span></div>
<div id="read"><b>形狀即概念：</b>方形是訓練、圓形是驗證、三角形是保留集。每一列由左往右是時間，圓形永遠在方形的右邊——模型只能用過去預測未來。</div>
</div>
<svg class="rough" id="r" width="1920" height="1080"></svg>
<script>
const rc=rough.svg(document.getElementById('r')),s=document.getElementById('r'),add=n=>s.appendChild(n);
const ink='#1b1b1b',X0=270,W=70,sz=50;
const box=document.getElementById('months');
for(let m=1;m<=18;m++){const d=document.createElement('div');d.className='m';d.style.left=(X0+(m-1)*W-6)+'px';d.style.top='345px';d.textContent=m;box.appendChild(d)}
const sq=(x,y,o)=>add(rc.rectangle(x,y,sz,sz,Object.assign({stroke:ink,strokeWidth:1.6,fill:'#2b4c7e',fillStyle:'hachure',hachureGap:6},o)));
const ci=(x,y,o)=>add(rc.circle(x+sz/2,y+sz/2,sz+8,Object.assign({stroke:ink,strokeWidth:2,fill:'#e0442b',fillStyle:'solid'},o)));
const tri=(x,y,o)=>add(rc.polygon([[x+sz/2,y-4],[x+sz+4,y+sz],[x-4,y+sz]],Object.assign({stroke:ink,strokeWidth:2,fill:'#e8b53a',fillStyle:'solid'},o)));
const dot=(x,y)=>add(rc.circle(x+sz/2,y+sz/2,8,{stroke:'#a8a296',fill:'#a8a296',fillStyle:'solid'}));
[[395,12,13],[505,13,14],[615,14,15]].forEach(([y,tr,v])=>{for(let m=1;m<=18;m++){const x=X0+(m-1)*W; if(m<=tr) sq(x,y); else if(m===v) ci(x,y); else dot(x,y);}});
for(let m=1;m<=18;m++){const x=X0+(m-1)*W; if(m>=16) tri(x,725); else dot(x,725);}
// legend: giant glyphs
add(rc.rectangle(1560,320,100,100,{stroke:ink,strokeWidth:2.4,fill:'#2b4c7e',fillStyle:'hachure',hachureGap:7}));
add(rc.circle(1610,560,110,{stroke:ink,strokeWidth:2.4,fill:'#e0442b',fillStyle:'solid'}));
add(rc.polygon([[1610,700],[1668,800],[1552,800]],{stroke:ink,strokeWidth:2.4,fill:'#e8b53a',fillStyle:'solid'}));
add(rc.line(X0-10,840,X0+18*W-10,840,{stroke:ink,strokeWidth:2.2}));
add(rc.line(X0+18*W-10,840,X0+18*W-30,828,{stroke:ink,strokeWidth:2.2}));add(rc.line(X0+18*W-10,840,X0+18*W-30,852,{stroke:ink,strokeWidth:2.2}));
</script></body></html>
