[project]
name = "olist-course"
version = "0.1.0"
description = "AI 時代的資料分析與特徵工程：Olist Kaggle 實戰（15h 課程）"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyarrow>=15",
  "kaggle>=1.6",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "jupyter>=1.0",
  "nbconvert>=7",
  "ipykernel>=6",
  "nbformat>=5",
  "pre-commit>=3.7",
  "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["olist_course"]
